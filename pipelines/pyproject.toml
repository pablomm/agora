[project]
name = "agora-pipelines"
version = "0.1.0"
description = "Data pipelines for Agora: download, normalise and publish entities and their data."
requires-python = ">=3.13"
dependencies = [
  "geopandas>=1.0",
  "pyarrow>=17",
  "requests>=2.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Only the shared helpers are installed; pipelines are plain scripts that import them.
[tool.setuptools.packages.find]
include = ["common*"]
