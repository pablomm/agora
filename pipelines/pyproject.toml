[project]
name = "agora-pipelines"
version = "0.1.0"
description = "Data pipelines for Agora: download, normalise and publish entities and their data."
requires-python = ">=3.13"
dependencies = [
  "geopandas>=1.0",
  "pyarrow>=17",
  "python-calamine>=0.3",
  "requests>=2.32",
  "scipy>=1.14",
]

[project.optional-dependencies]
# Diagnostic plots (income_distribution/plot.py).
plots = ["matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Only the shared helpers are installed; pipelines are plain scripts that import them.
[tool.setuptools.packages.find]
include = ["common*"]
