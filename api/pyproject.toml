[project]
name = "agora-api"
version = "0.1.0"
description = "Agora's API: the catalogue and the data, for the web (REST) and for agents (MCP)."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "duckdb>=1.1",
  "mcp>=1.2",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agora_api*"]

[tool.setuptools.package-data]
"agora_api.catalog" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
